[aerich]
tortoise_orm = app.db.config.TORTOISE_ORM_CONFIG
location = ./migrations
src_folder = .
timezone = UTC
# Ensure your TORTOISE_ORM_CONFIG in app.db.config.py has 'apps': {'models': {'models': [...]}} correctly defined.
# Example:
# TORTOISE_ORM_CONFIG = {
#     "connections": {"default": "postgres://user:pass@host:port/db"},
#     "apps": {
#         "models": {
#             "models": ["app.models.user_model", "aerich.models"], # "aerich.models" is required by Aerich
#             "default_connection": "default",
#         }
#     },
# }
